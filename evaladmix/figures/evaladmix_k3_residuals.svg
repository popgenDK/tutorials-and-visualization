<svg xmlns="http://www.w3.org/2000/svg" width="560" height="560" viewBox="0 0 560 560" role="img" aria-labelledby="title desc">
  <title id="title">evalAdmix residual correlation heatmap</title>
  <desc id="desc">Draft residual correlation heatmap with population blocks.</desc>
  <rect width="560" height="560" fill="#fff"/>
  <text x="290" y="34" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">Residual correlation, K=3</text>
  <g transform="translate(80,70)">
    <rect width="400" height="400" fill="#f6f6f6" stroke="#222"/>
    <g fill="#d9e9f6">
      <rect x="0" y="0" width="80" height="80"/><rect x="80" y="80" width="80" height="80"/><rect x="160" y="160" width="80" height="80"/><rect x="240" y="240" width="80" height="80"/><rect x="320" y="320" width="80" height="80"/>
    </g>
    <g fill="#b2182b" opacity="0.75">
      <rect x="80" y="0" width="80" height="80"/><rect x="0" y="80" width="80" height="80"/>
      <rect x="240" y="160" width="80" height="80"/><rect x="160" y="240" width="80" height="80"/>
    </g>
    <g fill="#2166ac" opacity="0.65">
      <rect x="320" y="80" width="80" height="80"/><rect x="80" y="320" width="80" height="80"/>
    </g>
    <g stroke="#222" stroke-width="1">
      <line x1="80" y1="0" x2="80" y2="400"/><line x1="160" y1="0" x2="160" y2="400"/><line x1="240" y1="0" x2="240" y2="400"/><line x1="320" y1="0" x2="320" y2="400"/>
      <line x1="0" y1="80" x2="400" y2="80"/><line x1="0" y1="160" x2="400" y2="160"/><line x1="0" y1="240" x2="400" y2="240"/><line x1="0" y1="320" x2="400" y2="320"/>
    </g>
    <text x="40" y="425" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">YRI</text>
    <text x="120" y="425" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">ASW</text>
    <text x="200" y="425" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">CEU</text>
    <text x="280" y="425" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">MXL</text>
    <text x="360" y="425" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">CHB</text>
  </g>
  <text x="280" y="525" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Blocks indicate structure not fully captured by the model.</text>
</svg>
