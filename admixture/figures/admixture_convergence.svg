<svg xmlns="http://www.w3.org/2000/svg" width="700" height="360" viewBox="0 0 700 360" role="img" aria-labelledby="title desc">
  <title id="title">ADMIXTURE convergence summary</title>
  <desc id="desc">Draft convergence plot comparing log likelihoods across seeds and K.</desc>
  <rect width="700" height="360" fill="#fff"/>
  <line x1="70" y1="300" x2="650" y2="300" stroke="#222"/>
  <line x1="70" y1="50" x2="70" y2="300" stroke="#222"/>
  <text x="360" y="338" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">Independent seed</text>
  <text x="24" y="180" font-family="Arial, sans-serif" font-size="15" transform="rotate(-90 24 180)" text-anchor="middle">Log likelihood</text>
  <polyline fill="none" stroke="#4C78A8" stroke-width="3" points="90,210 150,205 210,206 270,204 330,205 390,206 450,204 510,205 570,206"/>
  <polyline fill="none" stroke="#F58518" stroke-width="3" points="90,170 150,110 210,108 270,112 330,109 390,111 450,110 510,109 570,112"/>
  <polyline fill="none" stroke="#54A24B" stroke-width="3" points="90,250 150,95 210,160 270,92 330,185 390,96 450,150 510,94 570,180"/>
  <text x="600" y="207" font-family="Arial, sans-serif" font-size="13">K=2</text>
  <text x="600" y="112" font-family="Arial, sans-serif" font-size="13">K=3</text>
  <text x="600" y="176" font-family="Arial, sans-serif" font-size="13">K=4 unstable</text>
</svg>
