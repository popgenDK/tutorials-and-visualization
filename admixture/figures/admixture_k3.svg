<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">ADMIXTURE K3 ancestry proportions</title>
  <desc id="desc">Draft ADMIXTURE ancestry barplot for called genotypes.</desc>
  <rect width="900" height="360" fill="#fff"/>
  <line x1="70" y1="300" x2="850" y2="300" stroke="#222"/>
  <line x1="70" y1="60" x2="70" y2="300" stroke="#222"/>
  <text x="420" y="340" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">Individuals ordered by population</text>
  <text x="20" y="190" font-family="Arial, sans-serif" font-size="15" transform="rotate(-90 20 190)" text-anchor="middle">Ancestry proportion</text>
  <g transform="translate(90,60)">
    <rect x="0" y="0" width="90" height="240" fill="#4C78A8"/>
    <rect x="95" y="0" width="90" height="240" fill="#4C78A8"/>
    <rect x="210" y="10" width="90" height="230" fill="#F58518"/><rect x="210" y="0" width="90" height="10" fill="#4C78A8"/>
    <rect x="305" y="0" width="90" height="240" fill="#F58518"/>
    <rect x="420" y="90" width="90" height="150" fill="#F58518"/><rect x="420" y="0" width="90" height="90" fill="#54A24B"/>
    <rect x="515" y="110" width="90" height="130" fill="#F58518"/><rect x="515" y="0" width="90" height="110" fill="#54A24B"/>
    <rect x="630" y="0" width="90" height="240" fill="#54A24B"/>
    <text x="90" y="266" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">Pop 1</text>
    <text x="300" y="266" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">Pop 2</text>
    <text x="510" y="266" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">Admixed</text>
    <text x="675" y="266" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">Pop 3</text>
  </g>
</svg>
