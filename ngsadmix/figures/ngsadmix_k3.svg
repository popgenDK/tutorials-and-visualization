<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">NGSadmix K3 ancestry proportions</title>
  <desc id="desc">Draft ancestry barplot showing YRI, ASW, CEU, MXL and CHB groups for K equals 3.</desc>
  <rect width="900" height="360" fill="#ffffff"/>
  <line x1="70" y1="300" x2="850" y2="300" stroke="#222" stroke-width="1"/>
  <line x1="70" y1="60" x2="70" y2="300" stroke="#222" stroke-width="1"/>
  <text x="45" y="67" font-family="Arial, sans-serif" font-size="13" text-anchor="end">1.0</text>
  <text x="45" y="185" font-family="Arial, sans-serif" font-size="13" text-anchor="end">0.5</text>
  <text x="45" y="304" font-family="Arial, sans-serif" font-size="13" text-anchor="end">0</text>
  <text x="420" y="340" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">Individuals ordered by population</text>
  <text x="20" y="190" font-family="Arial, sans-serif" font-size="15" transform="rotate(-90 20 190)" text-anchor="middle">Ancestry proportion</text>
  <g transform="translate(80,60)">
    <g>
      <rect x="0" y="0" width="80" height="240" fill="#4C78A8"/>
      <rect x="86" y="0" width="80" height="240" fill="#4C78A8"/>
      <rect x="172" y="0" width="80" height="240" fill="#4C78A8"/>
      <text x="126" y="266" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">YRI</text>
    </g>
    <g>
      <rect x="270" y="24" width="80" height="216" fill="#4C78A8"/>
      <rect x="270" y="0" width="80" height="24" fill="#F58518"/>
      <rect x="356" y="36" width="80" height="204" fill="#4C78A8"/>
      <rect x="356" y="0" width="80" height="36" fill="#F58518"/>
      <text x="353" y="266" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">ASW</text>
    </g>
    <g>
      <rect x="454" y="0" width="80" height="240" fill="#F58518"/>
      <rect x="540" y="0" width="80" height="240" fill="#F58518"/>
      <text x="537" y="266" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">CEU</text>
    </g>
    <g>
      <rect x="638" y="96" width="70" height="144" fill="#F58518"/>
      <rect x="638" y="0" width="70" height="96" fill="#54A24B"/>
      <rect x="714" y="120" width="70" height="120" fill="#F58518"/>
      <rect x="714" y="0" width="70" height="120" fill="#54A24B"/>
      <text x="711" y="266" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">MXL</text>
    </g>
    <g>
      <rect x="804" y="0" width="56" height="240" fill="#54A24B"/>
      <text x="832" y="266" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">CHB</text>
    </g>
  </g>
  <rect x="690" y="20" width="14" height="14" fill="#4C78A8"/><text x="710" y="32" font-family="Arial, sans-serif" font-size="13">Component 1</text>
  <rect x="690" y="42" width="14" height="14" fill="#F58518"/><text x="710" y="54" font-family="Arial, sans-serif" font-size="13">Component 2</text>
  <rect x="690" y="64" width="14" height="14" fill="#54A24B"/><text x="710" y="76" font-family="Arial, sans-serif" font-size="13">Component 3</text>
</svg>
